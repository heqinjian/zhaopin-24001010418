server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: recruitment-website
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: 'yyyy-MM-dd HH:mm:ss'
    time-zone: Asia/Shanghai
  # 数据源
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/recruitment_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ROOT
  # 文件上传
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

# 自定义配置：文件上传目录
file:
  upload-path: D:/work/uploads/

# JWT 配置
jwt:
  secret: recruitment-website-jwt-secret-key-2024-web-architecture-course
  expiration: 604800000

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
